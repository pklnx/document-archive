# Groups the automatically generated release notes by pull request label.
# A pull request appears in the first matching category.
changelog:
  categories:
    - title: Breaking changes (manual steps needed)
      labels: [breaking]
    - title: Data model changes (update all devices)
      labels: [schema-change]
    - title: New features
      labels: [feature]
    - title: Bug fixes
      labels: [bug]
    - title: Documentation
      labels: [docs]
    - title: Dependencies
      labels: [dependencies]
    - title: Maintenance
      labels: ["*"]

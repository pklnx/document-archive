name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macOS and iOS are built from the same target; unsigned, so no secrets are needed.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            args: -destination 'platform=macOS'
          - platform: iOS
            args: -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
    name: build (${{ matrix.platform }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: xcodebuild -version
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project DocumentArchive.xcodeproj -scheme DocumentArchive \
            ${{ matrix.args }} CODE_SIGNING_ALLOWED=NO build | tail -n 50

  test:
    # Unit tests, hosted by the macOS app. They use an in-memory store and stub all
    # network access, so they need no secrets and never reach Mistral.
    runs-on: macos-latest
    name: test (macOS)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: xcodebuild -version
      - name: Test
        run: |
          set -o pipefail
          xcodebuild test -project DocumentArchive.xcodeproj -scheme DocumentArchive \
            -destination 'platform=macOS,arch=arm64' -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO | grep -E '✔|✘|error:|TEST (SUCCEEDED|FAILED)'
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TestResults
          path: TestResults.xcresult
          retention-days: 7

  gitleaks:
    # Scans the full history for credentials. The gitleaks binary is pinned and
    # checked against a SHA-256 kept here, so no third-party action runs with a token.
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          ./gitleaks version
      # Only the history of the checked-out commit: by default gitleaks scans all
      # fetched branches, so a leak on another open branch would fail every PR.
      - name: Scan history
        run: ./gitleaks git --config .gitleaks.toml --redact --exit-code 1 --no-banner --log-opts="HEAD" .

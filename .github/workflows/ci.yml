name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macOS and iOS are built from the same target; unsigned, so no secrets are needed.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            args: -destination 'platform=macOS'
          - platform: iOS
            args: -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
    name: build (${{ matrix.platform }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: xcodebuild -version
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project DocumentArchive.xcodeproj -scheme DocumentArchive \
            ${{ matrix.args }} CODE_SIGNING_ALLOWED=NO build | tail -n 50

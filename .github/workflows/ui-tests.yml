name: UI tests

# Nightly on main and on demand, not on every pull request: the hosted runners are slow and
# flaky for UI tests, and pull requests are gated by the reviewer's local UI test report
# (iOS 27). The runners have an older iOS (26.x) and macOS, which this run keeps covering.
# Not a required check.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Per ref: a manual run on a branch never cancels the scheduled run on main, or the other way round.
concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-ios-ui:
    # UI smoke tests on the smallest iPhone and the smallest iPad. The app starts with generated
    # sample data in memory (-UITestSeed), so no real archive, no iCloud and no Mistral.
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        device: [iphone, ipad]
    name: test (iOS UI, ${{ matrix.device }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/select-xcode
      - name: Pick simulator
        id: simulator
        env:
          DEVICE: ${{ matrix.device }}
        run: echo "udid=$(python3 scripts/pick-simulator.py "$DEVICE" smallest)" >> "$GITHUB_OUTPUT"
      - name: UI tests
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -o pipefail
          xcodebuild test -project DocumentArchive.xcodeproj -scheme DocumentArchiveUITests \
            -destination "platform=iOS Simulator,id=$UDID" -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY=- | xcbeautify --renderer github-actions
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TestResults-iOS-UI-${{ matrix.device }}
          path: TestResults.xcresult
          retention-days: 7

  test-macos-ui:
    # The Mac smoke tests (MacSmokeTests). An XCUITest runner on macOS must be signed (ad hoc,
    # "Sign to Run Locally", no team, no secrets) and needs automation mode, otherwise it hangs at
    # "Timed out while enabling automation mode". The app runs sandboxed like a release build, with
    # the CI-only entitlements (no iCloud or push, which an ad-hoc signature cannot carry) and its
    # own bundle identifier, so it gets its own container (see nightly-tests.yml, sandboxed job).
    runs-on: macos-26
    # Bounds a hang in automation mode or in a test; the default would be 6 hours.
    timeout-minutes: 30
    name: test (macOS UI)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/select-xcode
      - name: Enable automation mode
        run: sudo automationmodetool enable-automationmode-without-authentication
      - name: UI tests
        run: |
          set -o pipefail
          xcodebuild test -project DocumentArchive.xcodeproj -scheme DocumentArchiveUITests \
            -destination 'platform=macOS' -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY=- CODE_SIGN_ENTITLEMENTS=Config/DocumentArchive-macOS-SandboxTests.entitlements \
            DA_BUNDLE_ID_SUFFIX=.SandboxTests | xcbeautify --renderer github-actions
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TestResults-macOS-UI
          path: TestResults.xcresult
          retention-days: 7

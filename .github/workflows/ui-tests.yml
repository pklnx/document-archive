name: UI tests

# Nightly on main and on demand, not on every pull request: the hosted runners are slow and
# flaky for UI tests, and pull requests are gated by the reviewer's local UI test report
# (iOS 27). The runners have an older iOS (26.x), which this run keeps covering.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-tests
  cancel-in-progress: true

jobs:
  test-ios-ui:
    # UI smoke tests on the smallest iPhone and the smallest iPad. The app starts with generated
    # sample data in memory (-UITestSeed), so no real archive, no iCloud and no Mistral.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        device: [iphone, ipad]
    name: test (iOS UI, ${{ matrix.device }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: xcodebuild -version
      - name: Pick simulator
        id: simulator
        env:
          DEVICE: ${{ matrix.device }}
        run: echo "udid=$(python3 scripts/pick-simulator.py "$DEVICE" smallest)" >> "$GITHUB_OUTPUT"
      - name: UI tests
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -o pipefail
          xcodebuild test -project DocumentArchive.xcodeproj -scheme DocumentArchiveUITests \
            -destination "platform=iOS Simulator,id=$UDID" -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY=- | grep -E "Test Case|error:|TEST (SUCCEEDED|FAILED)"
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TestResults-iOS-UI-${{ matrix.device }}
          path: TestResults.xcresult
          retention-days: 7

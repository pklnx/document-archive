# gitleaks configuration: the default rules plus a rule for Mistral API keys.
# Used by the `gitleaks` CI job and the pre-commit hook in .githooks/.

[extend]
useDefault = true

# Mistral keys are 32 alphanumeric characters without a provider prefix, so
# neither GitHub secret scanning nor the default rules recognize them reliably.
# The console shows them with an optional "mstrl_" prefix.
[[rules]]
id = "mistral-api-key"
description = "Mistral AI API key"
regex = '''(?i)mistral[\w.\-]{0,40}?\s*[:=]\s*["']?(?:mstrl_)?([A-Za-z0-9]{32})["']?'''
secretGroup = 1
keywords = ["mistral"]
